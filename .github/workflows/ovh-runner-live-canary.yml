name: OVH runner live canary

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/ovh-runner-live-canary.yml

permissions:
  contents: read

jobs:
  live-runner:
    name: Build on disposable OVH runner
    runs-on: ovh-ci-live-20260826-212827
    timeout-minutes: 15
    steps:
      - name: Check out canary source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runner tools and build a real image
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          helm version --short
          docker buildx build --load --tag cloudx-ovh-runner-canary:live .
          docker run --detach --name cloudx-ovh-runner-canary --publish 127.0.0.1:18080:8080 cloudx-ovh-runner-canary:live
          trap 'docker rm --force cloudx-ovh-runner-canary >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep --fixed-strings --line-regexp ok; then
              exit 0
            fi
            sleep 1
          done
          exit 1
